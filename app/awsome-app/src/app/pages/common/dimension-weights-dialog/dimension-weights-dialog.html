<div class="header">
  <h2 mat-dialog-title>Pesos de las dimensiones</h2>
  <button mat-icon-button mat-dialog-close aria-label="Cerrar">
    <mat-icon fontSet="material-symbols-outlined">close</mat-icon>
  </button>
</div>
<mat-dialog-content>
  <app-dimension-weights-form [form]="form" />
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-button type="button" (click)="form.reset()">Restablecer</button>
  <button mat-flat-button type="button" (click)="save()">Guardar</button>
</mat-dialog-actions>
